body{

/* ROADMAP */

.roadmap{
display:grid;
grid-template-columns:repeat(14,40px);
gap:6px;
justify-content:center;

justify-content:center;

button{

<script>
const roadmap = document.getElementById("roadmap")

const cols = 14
const rows = 6

const cells = []
const results = []
const aiStats = {

A:{win:0,lose:0,total:0,last:null},
B:{win:0,lose:0,total:0,last:null},
C:{win:0,lose:0,total:0,last:null},
D:{win:0,lose:0,total:0,last:null},
E:{win:0,lose:0,total:0,last:null},
F:{win:0,lose:0,total:0,last:null},

L1:{win:0,lose:0,total:0,last:null},
L2:{win:0,lose:0,total:0,last:null},
L3:{win:0,lose:0,total:0,last:null},
L4:{win:0,lose:0,total:0,last:null},
L5:{win:0,lose:0,total:0,last:null},
L6:{win:0,lose:0,total:0,last:null},
L7:{win:0,lose:0,total:0,last:null},
L8:{win:0,lose:0,total:0,last:null},
L9:{win:0,lose:0,total:0,last:null},
L10:{win:0,lose:0,total:0,last:null},
L11:{win:0,lose:0,total:0,last:null},
L12:{win:0,lose:0,total:0,last:null},
L13:{win:0,lose:0,total:0,last:null},
L14:{win:0,lose:0,total:0,last:null},
L15:{win:0,lose:0,total:0,last:null}

}

const aiHistory = {
A:[],B:[],C:[],D:[],E:[],F:[],
L1:[],L2:[],L3:[],L4:[],L5:[],
L6:[],L7:[],L8:[],L9:[],L10:[],
L11:[],L12:[],L13:[],L14:[],L15:[]
}
const aiUltraHistory = [] // ✅ เพิ่มตรงนี้

let currentRow = 0
let currentCol = 0
let isReplay = false; // ✅ วางตรงนี้
let lastUltraBet = null; // ✅ เพิ่มบรรทัดนี้
let ultraStats = {
  win: 0,
  lose: 0
}




/* สร้าง grid */

for(let r=0;r<rows;r++){

 for(let c=0;c<cols;c++){

  const cell = document.createElement("div")
  cell.className="cell"

  roadmap.appendChild(cell)

  cells.push(cell)

 }

}

function getUltraPrediction(){

let lines = Object.keys(aiStats)

let ranked = lines.map(l=>{
 let s = aiStats[l]
 let acc = s.total ? s.win/s.total : 0
 return {line:l, acc}
})

ranked.sort((a,b)=>b.acc-a.acc)
let top15 = ranked.slice(0,15)

let scoreB = 0
let scoreP = 0

top15.forEach((item,i)=>{

 let stat = aiStats[item.line]
 let pred = stat.last
 if(!pred) return

 let weight = 1

 if(i < 3) weight = 3
 else if(i < 7) weight = 2

 if(stat.total > 10) weight++
 if(stat.total && stat.win/stat.total >= 0.6) weight++

 if(pred=="B") scoreB += weight
 if(pred=="P") scoreP += weight

})

if(scoreB === 0 && scoreP === 0) return null

return scoreB > scoreP ? "B" : "P"
}
function addResult(type){

if(results.length >= cols*rows) return

// ✅ 1. เก็บค่าก่อนแทง (เหมือน AI7)
let prevFinal = lastUltraBet

// ✅ 2. ใส่ผลจริง
results.push(type)

// ✅ 3. เช็ค AI ปกติ
checkAIPredict(type)

// ✅ 4. คำนวณ AI ใหม่ (จะ set lastUltraBet ใหม่)
analyzeAI()

// ✅ 5. ตัดสินผล (ใช้ "ค่าก่อนแทงเท่านั้น")
if(type !== "T" && prevFinal){

  let isWin = prevFinal === type

  // ✅ เก็บสถิติจริง
  if(isWin) ultraStats.win++
  else ultraStats.lose++

  // ✅ push history
  aiUltraHistory.push(isWin ? 1 : 0)
}

// render
drawBead()

drawMiniBead()

updateStats()

renderHistory()

renderUltraAI()

document.getElementById("lastResult").textContent = type
}

PROGRAM EXPIRE SYSTEM

</div>
`

}

}

checkExpire()

/* วาด Bead Road */

function drawBead(){

 cells.forEach(c=>c.className="cell");

 currentRow=0;
 currentCol=0;

 results.forEach(r=>{

  const index=currentRow*cols+currentCol;

  if(!cells[index]) return;

  if(r==="B") cells[index].classList.add("banker");
  if(r==="P") cells[index].classList.add("player");
  if(r==="T") cells[index].classList.add("tie");

  currentRow++;

  if(currentRow>=rows){
   currentRow=0;
   currentCol++;
  }

 });

 roadmap.scrollLeft=roadmap.scrollWidth;

}

function drawMiniBead(){

if(!canvas) return;

const ctx=canvas.getContext("2d");

ctx.clearRect(0,0,canvas.width,canvas.height);

const size=12;

results.forEach((r,i)=>{

let row=i%6;

let col=Math.floor(i/6);

let x=col*size+8;
let y=row*size+8;

ctx.beginPath();

ctx.arc(x,y,5,0,Math.PI*2);

ctx.fillStyle=
r=="P"?"#1976ff":
r=="B"?"#ff3030":
"#11aa22";

ctx.fill();

});

document.getElementById("miniP").innerHTML=
results.filter(x=>x=="P").length;

document.getElementById("miniB").innerHTML=
results.filter(x=>x=="B").length;

document.getElementById("miniT").innerHTML=
results.filter(x=>x=="T").length;

document.getElementById("miniTotal").innerHTML=
results.length;

}

function checkAIPredict(result){

if(result==="T") return

["A","B","C","D","E","F",
"L1","L2","L3","L4","L5","L6","L7","L8","L9","L10",
"L11","L12","L13","L14","L15"].forEach(line=>{

let pred = aiStats[line].last
if(!pred) return

aiStats[line].total++

let win = pred==result

if(win){
  aiStats[line].win++
  aiHistory[line].push(1)
}else{
  aiStats[line].lose++
  aiHistory[line].push(0)
}

})

renderHistory() // ✅ ใส่บรรทัดนี้
}


function replayAll(){

isReplay = true

// reset
Object.keys(aiStats).forEach(k=>{
  aiStats[k]={win:0,lose:0,total:0,last:null}
  aiHistory[k]=[]
})

aiUltraHistory.length = 0

let temp = [...results]
results.length = 0
ultraStats.win = 0
ultraStats.lose = 0

temp.forEach(r=>{

  // 1. ใส่ผล
  results.push(r)

  // 2. วิเคราะห์ก่อน (สำคัญ)
  analyzeAI()

  // 3. ใช้ตัวเดียวกับหน้าจอ
  let prevFinal = lastUltraBet

  if(r !== "T" && prevFinal){

    // AI ปกติ
    Object.keys(aiStats).forEach(line=>{
      let pred = aiStats[line].last
      if(!pred) return

      aiStats[line].total++

      if(pred === r){
        aiStats[line].win++
        aiHistory[line].push(1)
      }else{
        aiStats[line].lose++
        aiHistory[line].push(0)
      }
    })

    // ✅ Ultra (เหมือน addResult)
    let isWin = prevFinal === r

    if(isWin) ultraStats.win++
    else ultraStats.lose++

    aiUltraHistory.push(isWin ? 1 : 0)
  }

})

isReplay = false

drawBead()

drawMiniBead()

updateStats()

renderHistory()

renderUltraAI()
}

undo = function(){

if(results.length === 0) return

// ลบ 1 ตัว
results.pop()

// ✅ ไม่ต้อง reset อะไรเอง
// replayAll จะจัดการ state ทั้งหมดให้
replayAll()

}

[

function analyzeAI(){

if(results.length < 3){

  if(!isReplay){
    renderAI(null,null,null,null,null,null,"-",0)
  }

  return
}

/* กรอง T ออก */
let clean = results.filter(x=>x!=="T")
let last = clean.slice(-3)

if(last.length < 3){
  return
}

/* นับ */
let B = last.filter(x=>x=="B").length
let P = last.filter(x=>x=="P").length

let trend = B>P ? "B" : "P"

/* chop */
let chop=0
for(let i=1;i<last.length;i++){
  if(last[i]!=last[i-1]) chop++
}
let chopRate = chop/(last.length-1)

/* run */
let run=1, maxRun=1
for(let i=1;i<last.length;i++){
  if(last[i]==last[i-1]) run++
  else run=1
  if(run>maxRun) maxRun=run
}

/* ===== MAIN LINES ===== */

let lineA = trend
let lineB = chopRate>0.6 ? trend : (trend=="B"?"P":"B")
let lineC = B>P ? "P":"B"

let lineD = maxRun>=3 ? (trend=="B"?"P":"B") : trend

let prev = clean.slice(-4)
let lineE = trend
if(prev.length>=4){
  if(prev[0]==prev[2] && prev[1]==prev[3]){
    lineE = prev[0]
  }
}

let weightB = B*1.2
let weightP = P*1.2
if(maxRun>=2){
  if(trend=="B") weightB+=1
  else weightP+=1
}
let lineF = weightB>weightP ? "B":"P"

/* ===== L1–L15 ===== */

let L1 = (last[1]==last[2]) ? (last[2]=="B"?"P":"B") : trend
let L2 = maxRun>=2 ? (trend=="B"?"P":"B") : trend

let hist = clean
let L3 = hist.length>=4 ? hist[hist.length-4] : trend

let L4 = chopRate>0.5 ? (last[2]=="B"?"P":"B") : last[2]
let L5 = (last[0]==last[2]) ? (last[2]=="B"?"P":"B") : trend
let L6 = last[2]
let L7 = last[2]=="B"?"P":"B"
let L8 = last[2]

let long = clean.slice(-10)
let cB = long.filter(x=>x=="B").length
let cP = long.filter(x=>x=="P").length
let L9 = cB>cP?"B":"P"

let L10 = chopRate>0.7 ? last[0] : trend
let L11 = chopRate<0.3 ? trend : (trend=="B"?"P":"B")

let L12 = (B==P) ? (last[2]=="B"?"P":"B") : trend

let diff = Math.abs(B-P)
let L13 = diff>=2 ? trend : (trend=="B"?"P":"B")

let L14 = maxRun>=3 ? (trend=="B"?"P":"B") : trend

let pool = [L1,L2,L3,L4,L5,L6,L7,L8,L9,L10,L11,L12,L13,L14]
let cBB = pool.filter(x=>x=="B").length
let cPP = pool.filter(x=>x=="P").length
let L15 = cBB>cPP?"B":"P"

/* ===== CONFIDENCE ===== */

let scoreB=0, scoreP=0
let lines=[lineA,lineB,lineC,lineD,lineE,lineF,L1,L2,L3,L4,L5,L6,L7,L8,L9,L10,L11,L12,L13,L14,L15]

lines.forEach(v=>{
  if(v=="B") scoreB++
  if(v=="P") scoreP++
})

let bet = scoreB>scoreP?"B":"P"
let confidence = Math.round(Math.max(scoreB,scoreP)/lines.length*100)

/* ===== SAVE ===== */

aiStats.A.last=lineA
aiStats.B.last=lineB
aiStats.C.last=lineC
aiStats.D.last=lineD
aiStats.E.last=lineE
aiStats.F.last=lineF

aiStats.L1.last=L1
aiStats.L2.last=L2
aiStats.L3.last=L3
aiStats.L4.last=L4
aiStats.L5.last=L5
aiStats.L6.last=L6
aiStats.L7.last=L7
aiStats.L8.last=L8
aiStats.L9.last=L9
aiStats.L10.last=L10
aiStats.L11.last=L11
aiStats.L12.last=L12
aiStats.L13.last=L13
aiStats.L14.last=L14
aiStats.L15.last=L15

/* ===== RENDER ===== */

if(!isReplay){
  renderAI(
 lineA,lineB,lineC,lineD,lineE,lineF,
 bet,confidence,
 L1,L2,L3,L4,L5,L6,L7,L8,L9,L10,L11,L12,L13,L14,L15
)
  drawBead()
  updateStats()
  renderHistory()
    renderUltraAI() // 🔥 ใช้ตัวนี้แทน
}
}

function renderUltraAI(){

const box = document.getElementById("aiUltraBox");
const histBox = document.getElementById("aiUltraHistory");

if(!box || !histBox) return;

const MIN_ACC = 55;

let list=[];

/* ==========================
ชั้นที่ 1
Accuracy Filter
========================== */

Object.keys(aiStats).forEach(name=>{

    let s=aiStats[name];

    let acc=s.total ? s.win/s.total : 0;

    if(acc>=MIN_ACC/100 && s.last){

        list.push({
            name,
            side:s.last,
            acc,
            recent:aiHistory[name].slice(-5)
        });

    }

});

if(list.length==0){

box.innerHTML="<h3>รอข้อมูล...</h3>";
return;

}

/* ==========================
ชั้นที่ 2
Recent Form
========================== */

list.forEach(ai=>{

let r=ai.recent;

let win=r.filter(x=>x).length;

ai.recentScore=r.length ? win/r.length : 0.5;

});

/* ==========================
ชั้นที่ 3
Dynamic Weight
========================== */

list.forEach(ai=>{

ai.weight=

(ai.acc*0.60)+
(ai.recentScore*0.40);

});

/* ==========================
ชั้นที่ 4
เรียงคะแนน
========================== */

list.sort((a,b)=>b.weight-a.weight);

/* ==========================
ชั้นที่ 5
เลือก Top
========================== */

let top=list.slice(0,8);

/* ==========================
ชั้นที่ 6
Vote
========================== */

let scoreB=0;
let scoreP=0;

top.forEach(ai=>{

if(ai.side=="B") scoreB+=ai.weight*10;
else scoreP+=ai.weight*10;

});

let final=scoreB>=scoreP?"B":"P";

lastUltraBet=final;

/* ==========================
ชั้นที่ 7
Consensus
========================== */

let agree=top.filter(x=>x.side==final).length;

let consensus=Math.round(agree/top.length*100);

let stars=Math.round(consensus/20);

let starText="";

for(let i=0;i<5;i++){

starText+=i<stars?"★":"☆";

}

/* ==========================
ชั้นที่ 8
Confidence
========================== */

let avgAcc=

top.reduce((a,b)=>a+b.acc,0)/top.length;

let avgRecent=

top.reduce((a,b)=>a+b.recentScore,0)/top.length;

let confidence=Math.round(

(avgAcc*0.5+
avgRecent*0.3+
(consensus/100)*0.2)*100

);
/* ==========================
ชั้นที่ 9
Stability Analyzer
========================== */

top.forEach(ai=>{

    const h = aiHistory[ai.name];

    let change = 0;

    for(let i=1;i<h.length;i++){

        if(h[i] !== h[i-1])
            change++;

    }

    let stability =
        h.length <= 1
        ? 1
        : 1 - (change/(h.length-1));

    ai.stability = stability;

});

/* คะแนนความนิ่งเฉลี่ย */

let avgStability =
top.reduce((a,b)=>a+b.stability,0)
/
top.length;

/* เพิ่มผลต่อ Confidence */

confidence = Math.round(

confidence*0.85 +
(avgStability*100)*0.15

);
/* ==========================
เหตุผล
========================== */

let reason=[];

reason.push("✔ คัด AI ที่ต่ำกว่า 55% ออก");

reason.push(`✔ AI ผ่านการคัดเลือก ${top.length} / ${Object.keys(aiStats).length} สูตร`);

reason.push(`✔ WinRate เฉลี่ย ${(avgAcc*100).toFixed(1)}%`);
reason.push(
`✔ ความเสถียร AI ${(avgStability*100).toFixed(1)}%`
);

if(avgRecent>=0.7)
reason.push("✔ Recent Form แข็งแรง");
else
reason.push("✔ Recent Form ปานกลาง");

reason.push(`✔ คะแนนเสียง ${final=="B"?"BANKER":"PLAYER"} เหนืออีกฝั่ง`);

if(consensus>=80)
reason.push("✔ ความเห็น AI เป็นเอกฉันท์");
else if(consensus>=60)
reason.push("✔ AI ส่วนใหญ่เห็นตรงกัน");
else
reason.push("✔ AI ยังเห็นต่างกัน");

/* ==========================
History
========================== */

if(aiUltraHistory.length>50)
aiUltraHistory.shift();

/* ==========================
Render
========================== */

let color=final=="B"?"smartB":"smartP";

box.innerHTML=`

<div style="font-size:24px;font-weight:bold">

🔥 AI 9 ชั้น ฉลาด

</div>

<br>

<div class="${color}" style="font-size:34px;font-weight:bold">
    ${final=="B" ? "BANKER" : "PLAYER"}
</div>

<div style="font-size:20px">
    Confidence <b>${confidence}%</b>
</div>

<div style="margin-top:10px;font-size:18px;">
    ความเสถียร AI :
    <b>${(avgStability * 100).toFixed(1)}%</b>
</div>

<hr>

<div>
    AI ผ่านการคัดเลือก
    <b>${top.length} / ${Object.keys(aiStats).length}</b>
    สูตร
</div>

<br>

<div>

คะแนนเสียง

</div>

<div style="margin-top:8px">

BANKER

<div style="background:#333;border-radius:5px">

<div style="background:#ff3030;
width:${Math.min(scoreB,100)}%;
height:16px;border-radius:5px"></div>

</div>

${scoreB.toFixed(1)}

</div>

<br>

<div>

PLAYER

<div style="background:#333;border-radius:5px">

<div style="background:#2e6cff;
width:${Math.min(scoreP,100)}%;
height:16px;border-radius:5px"></div>

</div>

${scoreP.toFixed(1)}

</div>

<br>

Consensus

<div style="font-size:24px">

${starText}

</div>

<hr>

<div class="reason">

${reason.join("<br><br>")}

</div>

`;

histBox.innerHTML="";

aiUltraHistory.forEach(v=>{

let d=document.createElement("div");

d.className="ultraItem "+(v?"ultraWin":"ultraLose");

d.innerHTML=v?"✔":"✖";

histBox.appendChild(d);

});

}
function enableDrag(box,header){

let x=0,y=0;
let dx=0,dy=0;

header.onmousedown=dragStart;

function dragStart(e){

e.preventDefault();

dx=e.clientX;
dy=e.clientY;

document.onmouseup=stopDrag;
document.onmousemove=drag;

}

function drag(e){

e.preventDefault();

x=dx-e.clientX;
y=dy-e.clientY;

dx=e.clientX;
dy=e.clientY;

box.style.top=(box.offsetTop-y)+"px";
box.style.left=(box.offsetLeft-x)+"px";

}

function stopDrag(){

document.onmouseup=null;
document.onmousemove=null;

}

}

enableDrag(
document.getElementById("miniBeadFloat"),
document.getElementById("miniBeadHeader")
);

enableDrag(
document.getElementById("miniControlFloat"),
document.getElementById("miniControlHeader")
);
